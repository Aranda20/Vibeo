<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibeo - Reproduciendo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .player-card {
            width: 100%;
            max-width: 380px;
            background: #121212;
            padding: 24px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }
        .cover-box {
            width: 220px;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .track-meta {
            width: 100%;
            margin-bottom: 20px;
        }
        .track-meta h2 {
            margin: 0 0 6px 0;
            font-size: 1.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-meta p {
            margin: 0;
            color: #b3b3b3;
            font-size: 0.9rem;
        }
        .action-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-volver {
            background-color: #242424;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="cover-box">
            <img id="player-cover" src="assets/imagenes/logo.png" alt="Portada">
        </div>

        <div class="track-meta">
            <h2 id="player-title">Cargando...</h2>
            <p id="player-artist">Vibeo</p>
        </div>

        <!-- Contenedor exacto para inyectar el reproductor interno -->
        <div class="action-container" id="action-box"></div>

        <a href="index.html" class="btn-volver">← Volver a Vibeo</a>
    </div>

    <script src="reproductor.js"></script>
</body>
</html>
