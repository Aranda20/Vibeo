<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibeo - Reproduciendo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .player-card {
            width: 100%;
            max-width: 380px;
            background: #121212;
            padding: 24px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }
        .cover-box {
            width: 260px;
            height: 260px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .track-meta {
            width: 100%;
            margin-bottom: 20px;
        }
        .track-meta h2 {
            margin: 0 0 6px 0;
            font-size: 1.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-meta p {
            margin: 0;
            color: #b3b3b3;
            font-size: 0.95rem;
        }
        .audio-wrapper {
            width: 100%;
            margin-top: 10px;
        }
        audio {
            width: 100%;
            outline: none;
        }
        .btn-volver {
            background-color: #1db954;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 24px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="cover-box">
            <img id="player-cover" src="assets/imagenes/logo.png" alt="Portada">
        </div>

        <div class="track-meta">
            <h2 id="player-title">Cargando...</h2>
            <p id="player-artist">Vibeo</p>
        </div>

        <div class="audio-wrapper">
            <audio id="main-audio" controls autoplay></audio>
        </div>

        <a href="index.html" class="btn-volver">← Volver a Vibeo</a>
    </div>

    <script src="reproductor.js"></script>
</body>
</html>
